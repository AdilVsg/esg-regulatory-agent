name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as the Dockerfile base image
          cache: pip

      # requirements-dev.txt pulls in requirements.txt via its -r line, so this
      # installs the runtime and the test dependencies in one step.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The suite mocks every Gemini and Tavily call, so no API key is needed
      # and the job spends no quota. The eval scripts are deliberately not run
      # here: they cost real quota and are a manual, dated exercise.
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Build only, no push: the image is not deployed from CI, so this just
      # proves the Dockerfile still builds against the current requirements.
      - name: Build image
        run: docker build -t esg-regulatory-agent:ci .